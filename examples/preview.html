<!doctype html>
<html lang="uk">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Басейн · дві картки</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f2f6f5;
      color: #283c41;
    }
    header {
      padding: 32px 24px 16px;
    }
    h1 {
      font-size: 26px;
      font-weight: 500;
      margin: 0 0 8px;
    }
    header p {
      color: #667d81;
      font-size: 14px;
    }
    .theme {
      padding: 24px;
      --card-background-color: #fff;
      --primary-text-color: #283c41;
      --secondary-text-color: #647c81;
      --secondary-background-color: #edf3f3;
      --divider-color: #d5e1e1;
      --primary-color: #268eaa;
    }
    .dark {
      background: #111c22;
      color: #e4edef;
      --card-background-color: #1c2a32;
      --primary-text-color: #e4edef;
      --secondary-text-color: #9ab0b9;
      --secondary-background-color: #273b45;
      --divider-color: #3b505a;
      --primary-color: #6bc9d3;
      --error-color: #ffada3;
    }
    h2 {
      font-size: 14px;
      font-weight: 500;
      margin: 0 0 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
      max-width: 1600px;
      margin: auto;
    }
    .label {
      font-size: 11px;
      letter-spacing: 1.3px;
      margin: 0 0 12px;
      color: var(--secondary-text-color);
    }
    @media (max-width: 1050px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    @media (max-width: 600px) {
      header {
        padding: 24px 16px 8px;
      }
      .theme {
        padding: 24px 16px;
      }
      .grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }
  </style>
  <header>
    <h1>Басейн. Світло й рух.</h1>
    <p>Два незалежні канали · натисніть на світильник або насос</p>
  </header>
  <main></main>
  <script type="module">
    import '../dist/sonoff-pool-card.js';
    const params = new URLSearchParams(location.search);
    for (const theme of ['light', 'dark']) {
      if (params.has('theme') && params.get('theme') !== theme) continue;
      const section = document.createElement('section');
      section.className = `theme ${theme}`;
      section.innerHTML = `<h2>${theme === 'light' ? 'Світла тема' : 'Темна тема'}</h2><div class="grid"></div>`;
      document.querySelector('main').append(section);
      for (const kind of ['light', 'pump'])
        for (const state of ['off', 'on', 'pending', 'unavailable']) {
          if (params.has('state') && params.get('state') !== state) continue;
          const tile = document.createElement('div');
          tile.innerHTML = `<p class="label">${{ off: 'ВИМКНЕНО', on: 'УВІМКНЕНО', pending: 'ОЧІКУВАННЯ', unavailable: 'НЕДОСТУПНО' }[state]}</p>`;
          const card = document.createElement(`sonoff-pool-${kind}-card`);
          card.dataset.state = state;
          card.dataset.kind = kind;
          const entity = `switch.preview_${kind}`;
          card.setConfig({ type: `custom:sonoff-pool-${kind}-card`, entity });
          const update = (next) =>
            (card.hass = {
              states: { [entity]: { state: next, attributes: {} } },
              callService: async (domain, service) => {
                if (state === 'pending') return new Promise(() => {});
                setTimeout(() => update(service === 'turn_on' ? 'on' : 'off'), 1100);
              },
            });
          update(state === 'pending' ? 'off' : state);
          tile.append(card);
          section.querySelector('.grid').append(tile);
          await card.updateComplete;
          if (state === 'pending') {
            const start = () => card.shadowRoot.querySelector('button').click();
            start();
            // Repeat the real bounded pending cycle for this demonstration tile.
            setInterval(start, 11000);
          }
        }
    }
  </script>
</html>
